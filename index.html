<!doctype html><meta charset="utf-8"><title>🍑 타이머</title>
<style>
:root{--p:#E2A4A4;--ink:#6b4f4f}
*{box-sizing:border-box;user-select:none}
body{margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#111;font-family:"Malgun Gothic",sans-serif;color:#f3dcdc}
svg{width:300px;height:300px;touch-action:none;cursor:pointer}
#t{font-size:34px;font-weight:700;letter-spacing:2px}
.r{display:flex;gap:8px}
button{border:0;border-radius:20px;padding:8px 16px;background:#2a2a2a;color:#f3dcdc;font:inherit;font-weight:700;box-shadow:0 3px 0 #000;cursor:pointer}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
#go{background:var(--p);color:#fff;box-shadow:0 3px 0 #c98585}
</style>
<svg id="d" viewBox="0 0 300 300">
 <rect x="6" y="6" width="288" height="288" rx="52" fill="#2a2a2a"/>
 <rect x="20" y="20" width="260" height="260" rx="40" fill="#fff"/>
 <g id="ticks" font-size="15" font-weight="700" fill="#6b4f4f" text-anchor="middle"></g>
 <path id="w" fill="#E2A4A4"/>
 <circle cx="150" cy="150" r="24" fill="#fff" stroke="#f0d6d2" stroke-width="3"/>
 <circle cx="143" cy="148" r="2.5" fill="#6b4f4f"/><circle cx="157" cy="148" r="2.5" fill="#6b4f4f"/>
 <circle cx="138" cy="155" r="4" fill="#E2A4A4" opacity=".7"/><circle cx="162" cy="155" r="4" fill="#E2A4A4" opacity=".7"/>
 <path d="M146 154q4 4 8 0" stroke="#6b4f4f" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
<div id="mode" style="font-weight:700;margin-bottom:-12px">🍅 집중</div>
<div id="t">25:00</div>
<div class="r"><button id="go">시작</button><button data-m="5">5분</button><button data-m="10">10분</button><button data-m="25">25분</button></div>
<script>
const $=s=>document.querySelector(s),C=150,pt=(a,r)=>[C-r*Math.sin(a),C-r*Math.cos(a)];
let rem=25*60,end=0,run=false;
for(let i=0;i<60;i++){const a=i*Math.PI/30,big=i%5==0,[x1,y1]=pt(a,big?100:104),[x2,y2]=pt(a,110);
 $('#ticks').innerHTML+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#6b4f4f" stroke-width="${big?3:1.5}" stroke-linecap="round"/>`;
 if(big){const[x,y]=pt(a,82);$('#ticks').innerHTML+=`<text x="${x}" y="${y+5}">${i}</text>`}}
function draw(){
 const m=Math.min(rem/60,60),[x,y]=pt(m*Math.PI/30,115);
 $('#w').setAttribute('d',m>=59.99?'M150 35A115 115 0 1 0 150.01 35Z':m<=0?'':`M150 150L150 35A115 115 0 ${m>30?1:0} 0 ${x} ${y}Z`);
 const s=Math.ceil(rem);$('#t').textContent=String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
 document.title='🍑 '+$('#t').textContent}
function tick(){if(!run)return;rem=Math.max(0,(end-Date.now())/1000);draw();
 if(rem<=0){beep();next();return}requestAnimationFrame(tick)}
let focus=true,done=0;
function next(){if(focus)done++;focus=!focus;
 $('#w').setAttribute('fill',focus?'#E2A4A4':'#B9D9C9');
 $('#mode').textContent=focus?'🍅 집중':(done%4?'☕ 휴식':'🌿 긴 휴식')+' · 🍅×'+done;
 set(focus?25:done%4?5:15);end=Date.now()+rem*1000;requestAnimationFrame(tick)}
function stop(){run=false;$('#go').textContent='시작'}
function beep(){const c=new AudioContext();[0,.25,.5].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;
 o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.2,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+.2);o.start(c.currentTime+t);o.stop(c.currentTime+t+.2)})}
function set(m){rem=m*60;if(run)end=Date.now()+rem*1000;draw()}
$('#go').onclick=()=>{if(run)return stop();if(rem<=0)return;run=true;end=Date.now()+rem*1000;$('#go').textContent='일시정지';tick()};
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{stop();set(+b.dataset.m)});
const d=$('#d');
function drag(e){const r=d.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;
 let m=Math.round(((Math.atan2(-dx,-dy)*180/Math.PI+360)%360)/6);if(m==0&&rem>1800)m=60;set(m)}
d.onpointerdown=e=>{d.setPointerCapture(e.pointerId);drag(e);d.onpointermove=drag};
d.onpointerup=()=>d.onpointermove=null;
draw();
</script>
